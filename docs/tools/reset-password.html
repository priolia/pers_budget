<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля - Budget App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #856404;
        }

        .info {
            background: #d1ecf1;
            border: 1px solid #17a2b8;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #0c5460;
        }

        .success {
            background: #d4edda;
            border: 1px solid #28a745;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            color: #155724;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        pre {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            overflow-x: auto;
            font-size: 12px;
            margin: 10px 0;
        }

        .status {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Сброс пароля</h1>

        <div class="warning">
            <strong>⚠️ Проблема:</strong> Пароль был изменен в браузере, но не синхронизирован с сервером.
            При следующей загрузке сервер вернул старые данные и перезаписал новый пароль.
        </div>

        <div class="info">
            <strong>📝 Текущие данные в localStorage:</strong>
            <pre id="current-data">Проверка...</pre>
        </div>

        <button onclick="checkLocalStorage()">🔍 Проверить localStorage</button>
        <button onclick="resetPassword()" class="btn-danger">🗑️ Сбросить пароль (удалить)</button>
        <button onclick="goToApp()">🏠 Открыть приложение</button>

        <div id="status" class="status"></div>
    </div>

    <script>
        const STORAGE_KEY = 'budget_config_v2';

        function checkLocalStorage() {
            const data = localStorage.getItem(STORAGE_KEY);
            const currentDataEl = document.getElementById('current-data');

            if (data) {
                try {
                    const config = JSON.parse(data);
                    currentDataEl.textContent = JSON.stringify(config, null, 2);

                    if (config.passwordHash) {
                        showStatus('success', `✅ Найден хеш пароля: ${config.passwordHash.substring(0, 20)}...`);
                    } else {
                        showStatus('warning', '⚠️ Хеш пароля не найден в config');
                    }
                } catch (e) {
                    currentDataEl.textContent = data;
                    showStatus('error', '❌ Ошибка парсинга JSON: ' + e.message);
                }
            } else {
                currentDataEl.textContent = 'Нет данных в localStorage';
                showStatus('warning', '⚠️ Config не найден в localStorage');
            }
        }

        function resetPassword() {
            if (!confirm('Вы уверены? Это удалит сохраненный пароль и позволит войти без пароля.')) {
                return;
            }

            const data = localStorage.getItem(STORAGE_KEY);

            if (data) {
                try {
                    const config = JSON.parse(data);

                    // Удаляем passwordHash
                    delete config.passwordHash;

                    // Сохраняем обратно
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(config));

                    showStatus('success', '✅ Пароль успешно удален! Теперь можете войти в приложение без пароля.');

                    // Обновляем отображение
                    checkLocalStorage();

                } catch (e) {
                    showStatus('error', '❌ Ошибка: ' + e.message);
                }
            } else {
                showStatus('warning', '⚠️ Config не найден в localStorage');
            }
        }

        function goToApp() {
            window.location.href = 'index.html';
        }

        function showStatus(type, message) {
            const statusEl = document.getElementById('status');
            statusEl.className = 'status ' + type;
            statusEl.textContent = message;
        }

        // Автоматическая проверка при загрузке
        window.addEventListener('load', checkLocalStorage);
    </script>
</body>
</html>
